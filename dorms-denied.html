<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DoRms 연결 안내 | BOOONG</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="https://yadoran-2025.github.io/booong-design-system/releases/v2.0.0/booong.css">
  <style>
    body { min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: var(--space-4); background: var(--bg); color: var(--text); font-family: var(--font-sans); }
    main { width: min(100%, 460px); border: 1px solid var(--border); border-radius: var(--radius); background: var(--color-surface); padding: var(--space-6); }
    h1 { margin: 0 0 var(--space-2); }
    p { margin: 0 0 var(--space-5); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">도름스 연결을 확인해주세요</h1>
    <p id="message">현재 이용 가능 여부를 확인하지 못했습니다.</p>
    <a id="retry" href="/">다시 시도하기 →</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const reason = params.get("reason");
    const next = params.get("next");
    const target = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const retry = document.getElementById("retry");
    if (reason === "access_denied") {
      title.textContent = "코멘트를 작성할 수 없어요";
      message.textContent = "도름스에서 현재 허용 상태와 코멘트 작성 조건을 확인해 주세요.";
      retry.textContent = "DoRms로 이동하기 →";
      retry.href = "https://dorms.school/connect";
    } else if (reason === "authentication_required") {
      title.textContent = "로그인이 필요해요";
      message.textContent = "도름스 로그인을 다시 진행해 주세요.";
      retry.href = `/login.html?next=${encodeURIComponent(target)}`;
    } else {
      title.textContent = "도름스 연결을 확인하지 못했어요";
      message.textContent = "잠시 뒤 다시 시도해 주세요. 확인이 실패한 동안에는 코멘트를 작성할 수 없습니다.";
      retry.href = `/login.html?next=${encodeURIComponent(target)}`;
    }
  </script>
</body>
</html>
