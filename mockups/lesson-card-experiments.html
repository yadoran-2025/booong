<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BOOONG · 과감한 수업 카드 3안</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"><link rel="stylesheet" href="https://yadoran-2025.github.io/booong-design-system/releases/v2.0.0/booong.css"><link rel="stylesheet" href="../css/font-overrides.css"><link rel="stylesheet" href="lesson-card-experiments.css"></head><body class="card-experiments"><main class="experiments-shell"><header class="experiments-head"><b>BOOONG</b><a href="lesson-cards.html#lesson-library">기존 카드와 비교 ↗</a></header><div class="experiments-intro"><h1>수업 고르는 장면, 더 과감하게.</h1><p>과목과 단원을 살리면서 카드의 두께·크기·형태를 달리한 3안입니다. 모두 클릭해 소개를 열고 수업함에 담을 수 있습니다.</p></div><div class="experiments-grid"><article class="experiment"><h2><span>A</span>수업 팩</h2><p>제목 아래 과목·단원, 하단에는 조회·저장·댓글. 포인터를 따라 팩이 펼쳐집니다.</p><a href="lesson-packs.html#lesson-library" aria-label="수업 팩 목업"><img src="lesson-packs-selection.jpg" width="984" height="664" alt="수업 팩 수업 선택 화면"></a><a class="btn btn--primary" href="lesson-packs.html#lesson-library">수업 골라보기 ↗</a></article><article class="experiment"><h2><span>B</span>크기가 다른 쇼케이스</h2><p>한 수업을 크게 펼치고, 작은 카드들을 맞물려 배치합니다.</p><a href="lesson-showcase.html#lesson-library" aria-label="크기가 다른 쇼케이스 목업"><img src="lesson-showcase-selection.jpg" width="984" height="664" alt="크기가 다른 쇼케이스 수업 선택 화면"></a><a class="btn btn--primary" href="lesson-showcase.html#lesson-library">수업 골라보기 ↗</a></article><article class="experiment"><h2><span>C</span>도려낸 수업 티켓</h2><p>사진·수업명·큰 단원 번호를 한 장의 티켓으로 묶습니다.</p><a href="lesson-tickets.html#lesson-library" aria-label="도려낸 수업 티켓 목업"><img src="lesson-tickets-selection.jpg" width="984" height="664" alt="도려낸 수업 티켓 수업 선택 화면"></a><a class="btn btn--primary" href="lesson-tickets.html#lesson-library">수업 골라보기 ↗</a></article></div></main></body></html>
